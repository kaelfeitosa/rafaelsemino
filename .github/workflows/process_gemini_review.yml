name: Process Gemini Review

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  log-gemini-comments:
    name: Process Gemini Review
    if: github.event.review.user.login == 'gemini-code-assist[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache-dependency-path: acervo/cli/go.sum

      - name: Repost Review as User
        env:
          USER_PAT: ${{ secrets.USER_PAT }}
          REPO: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
        working-directory: acervo/cli
        run: |
          echo "Reposting review comments using Go CLI..."
          go run main.go repost-review \
            --repo "$REPO" \
            --pull-number "$PULL_NUMBER" \
            --review-id "$REVIEW_ID"
